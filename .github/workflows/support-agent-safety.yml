name: Support agent safety

on:
  pull_request:
    paths:
      - 'server/services/agents/**'
      - 'server/services/KnowledgeBase*.ts'
      - 'server/services/knowledge/**'
      - 'server/models/supportOrchestration/**'
      - 'server/models/knowledgeBase/**'
      - 'server/models/knowledge/**'
      - 'server/services/supportMedia/**'
      - 'server/models/supportMedia/**'
      - 'server/migrations/215_create_support_media_gallery.js'
      - 'client/src/app/dashboard/(main)/knowledge-base/media/**'
      - 'client/src/app/support-widget/**'
      - 'server/migrations/**'
      - 'server/tests/**support**'
      - 'shared/**'
      - '.node-version'
      - 'package.json'
      - 'server/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'server/tests/agentRouter.test.ts'
      - 'server/tests/contactValidation.test.ts'
      - 'server/utils/agentPromptBuilder.ts'
      - '.github/workflows/support-agent-safety.yml'
  push:
    branches: [staging]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_checks:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: support-agent-safety-${{ inputs.release_checks && 'production' || 'standard' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.release_checks && 60 || 25 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify support architecture registries and quarantine
        run: pnpm --dir server support:architecture:audit
      - name: Verify canonical knowledge gateway boundaries
        run: pnpm --dir server knowledge:architecture:audit

      - name: Verify governed support media architecture
        run: pnpm --dir server test:media:acceptance
      - name: Typecheck server
        # The production release requires this in Cross-layer regression.
        if: '!inputs.release_checks'
        run: pnpm --dir server typecheck
      - name: Run safety, privacy, playbook, KB, and specialist acceptance tests
        run: pnpm --dir server test:support:acceptance
      - name: Run evidence, privacy, chunking, and claim-verification tests
        run: pnpm --dir server test:knowledge:acceptance
