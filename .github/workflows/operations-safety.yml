name: Operations safety
on:
  pull_request:
  push:
    branches: [staging]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_checks:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: operations-safety-${{ inputs.release_checks && 'production' || 'standard' }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.1'
      - run: corepack enable && corepack prepare pnpm@10.30.3 --activate
      - run: test "$(pnpm --version)" = 10.30.3
      - run: pnpm install --frozen-lockfile
      - name: Validate deployment script syntax
        run: |
          for script in deploy.sh deploy-staging.sh scripts/deploy-production-release.sh scripts/poll-production-release.sh scripts/test-campaign-history-migration.sh; do
            bash -n "$script" || exit
          done
      - run: python3 -m unittest discover -s scripts/tests -p 'test_deploy*.py' -v
      - run: node --experimental-vm-modules --test scripts/tests/migration-safety.test.mjs
      - run: node scripts/check-build-secrets.mjs
      - run: python3 -m unittest discover -s scripts/tests -p 'test_build_context.py' -v
      - name: Security scan regression boundaries
        working-directory: server
        env:
          NODE_ENV: test
          SKIP_DB: 'true'
          DISABLE_BACKGROUND_JOBS: 'true'
          NODE_OPTIONS: --experimental-vm-modules
        run: pnpm exec jest --runInBand --runTestsByPath tests/scanPermissionBoundaries.test.ts tests/scanWorkflowIsolation.test.ts tests/adminSessionSecurity.test.ts tests/publicFetchPinning.test.ts tests/boundedUpload.test.ts tests/boundedDemoInput.test.ts tests/demoParseCredits.test.ts tests/safeRemoteFetch.test.ts tests/metaManualIdentity.test.ts tests/userWebhookTokens.test.ts tests/webhookCapabilityScope.test.ts tests/providerOAuthStatusContract.test.ts
      - name: Safe email windows and bounded gallery requests
        run: pnpm --dir client exec vitest run src/__tests__/emailMessageWindow.test.ts src/__tests__/supportMediaUpload.test.ts
      - name: Metadata-only tracing, log sinks, readiness
        working-directory: server
        env:
          NODE_ENV: test
          SKIP_DB: 'true'
          LANGFUSE_ENABLED: 'false'
          DISABLE_BACKGROUND_JOBS: 'true'
          AD_PROVIDER_MUTATIONS_ENABLED: 'false'
          SUPPORT_NOTIFICATION_DELIVERY_MODE: simulate
          NODE_OPTIONS: --experimental-vm-modules --require=../scripts/tests/no-network.cjs
        run: pnpm exec jest --runInBand --runTestsByPath tests/langfuseSafety.test.ts tests/operationalLogging.test.ts tests/systemLogBackpressure.test.ts tests/readiness.test.ts tests/systemLogRedaction.test.ts tests/loggerResilience.test.ts tests/secretsManager.test.ts
      # The production release also requires Cross-layer regression, which
      # type-checks the same revision. Keep this check for standalone runs.
      - if: '!inputs.release_checks'
        run: pnpm --dir server typecheck
      - run: pnpm --dir server build:all
      - name: Campaign history migration on isolated PostgreSQL
        if: inputs.release_checks
        run: bash scripts/test-campaign-history-migration.sh
      - name: Production dependency advisories
        run: pnpm audit --prod --audit-level high
  chromium-sandbox:
    name: Sandboxed Chromium in the API image
    needs: safety
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.release_checks && 60 || 30 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the release API image
        run: docker build --build-arg RELEASE_SHA=${{ github.sha }} -f server/Dockerfile -t asksales-security-api:${{ github.sha }} .
      - name: Verify Linux sandbox and direct-network backstop
        run: bash scripts/check-chromium-sandbox.sh asksales-security-api:${{ github.sha }}
      - name: Export verified API image for the approved rollout
        if: github.event_name == 'workflow_dispatch' && !inputs.release_checks
        run: docker save asksales-security-api:${{ github.sha }} | gzip -1 > api.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && !inputs.release_checks
        with:
          name: release-api-${{ github.sha }}
          path: api.tar.gz
          retention-days: 1
          compression-level: 0
  release-images:
    name: Release image (${{ matrix.service }})
    if: github.event_name == 'workflow_dispatch' && !inputs.release_checks
    needs: safety
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: worker
            dockerfile: server/Dockerfile.worker
          - service: client
            dockerfile: client/Dockerfile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the release image
        run: >-
          docker build --build-arg RELEASE_SHA=${{ github.sha }}
          --build-arg NEXT_PUBLIC_API_URL=
          --build-arg NEXT_PUBLIC_GOOGLE_SIGN_IN_CLIENT_ID=1032811885339-84mnqvfgcffq3qh1ptbh15vpg1a182k0.apps.googleusercontent.com
          --build-arg BACKEND_URL=http://api:8080
          -f ${{ matrix.dockerfile }} -t asksales-security-${{ matrix.service }}:${{ github.sha }} .
      - name: Export the release image
        run: docker save asksales-security-${{ matrix.service }}:${{ github.sha }} | gzip -1 > ${{ matrix.service }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.service }}-${{ github.sha }}
          path: ${{ matrix.service }}.tar.gz
          retention-days: 1
          compression-level: 0
