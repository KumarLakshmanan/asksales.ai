name: Cross-layer regression

on:
  pull_request:
    paths:
      - 'deploy*.sh'
      - 'docker-compose*.yml'
      - '**/Dockerfile*'
      - '.dockerignore'
      - 'nginx/**'
      - 'scripts/**'
      - 'pnpm-workspace.yaml'
      - 'client/**'
      - 'server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cross-layer-regression.yml'
  push:
    branches: [staging]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_checks:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cross-layer-regression-${{ inputs.release_checks && 'production' || 'standard' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.release_checks && 60 || 30 }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.1'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Server workflow contracts
        working-directory: server
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: >-
          pnpm exec jest --runInBand --runTestsByPath
          tests/crossLayerWorkflowRegression.test.ts
          tests/leadRequestConstraints.test.ts
          tests/leadExecutor.test.ts
          tests/icpGenerationProviderFallback.test.ts
          tests/providerDatasetResults.test.ts
          tests/conversationApprovalContract.test.ts
          tests/realtimeGateway.test.ts
          tests/supportOrchestrationCore.test.ts
          tests/supportPresenceAndHandoffRecovery.test.ts
          tests/whatsappDeliveryStatusAudit.test.ts
          tests/whatsappHandoffRecovery.test.ts
          tests/metaSupportMessagingContract.test.ts
          tests/adsExecutorNormalization.test.ts
          tests/performanceReviewContract.test.ts
          tests/whatsappTemplatePayload.test.ts
          tests/migrationTableClassification.test.ts
          tests/whatsappSendChokePoint.test.ts
          tests/whatsappPlatformBilling.test.ts
          tests/whatsappPlatformBillingAdmin.test.ts
          tests/whatsappPlatformBillingHooks.test.ts
          tests/whatsappCreditLine.test.ts
          tests/whatsappBillingStatement.test.ts
          tests/meteredCredits.test.ts
          tests/creditService.test.ts
      - name: Client recovery and review contracts
        working-directory: client
        run: >-
          pnpm exec vitest run
          src/__tests__/crossLayerWorkflowRecovery.test.ts
          src/__tests__/conversationStreamReducer.test.ts
          src/__tests__/websocketService.test.ts
          src/__tests__/toolMessagePairing.test.ts
          src/__tests__/leadGenReviewContract.test.ts
          src/__tests__/leadInputsTabRefresh.test.ts
          src/__tests__/sendOutreachContract.test.ts
          src/__tests__/adCampaignPublishing.test.ts
          src/__tests__/publishAdsReviewContract.test.ts
      # checkout's `git clean -ffdx` deletes in-repo .tsbuildinfo files, so
      # every run used to type-check from scratch (~8 min on the release
      # host). Keep the incremental state in the runner's persistent tool
      # cache instead. tsc keys it on file content hashes, so state written
      # by another commit or branch only skips files whose content and
      # dependencies are unchanged. Ephemeral hosted runners just start cold.
      - name: Prepare TypeScript incremental cache
        run: mkdir -p "$RUNNER_TOOL_CACHE/asksales-tsc"
      - name: Typecheck server
        run: pnpm --dir server typecheck --incremental --tsBuildInfoFile "$RUNNER_TOOL_CACHE/asksales-tsc/server.tsbuildinfo"
      - name: Typecheck client
        # The client program outgrew Node's default ~1.5 GB heap. The runner
        # needs sufficient heap on hosted runners.
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: pnpm --dir client typecheck --incremental --tsBuildInfoFile "$RUNNER_TOOL_CACHE/asksales-tsc/client.tsbuildinfo"

  browser:
    needs: contracts
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    timeout-minutes: ${{ inputs.release_checks && 60 || 30 }}
    env:
      E2E_BASE_URL: ${{ inputs.release_checks && 'http://127.0.0.1:3200' || 'http://127.0.0.1:3000' }}
      BACKEND_URL: ${{ inputs.release_checks && 'http://127.0.0.1:3201' || 'http://127.0.0.1:8080' }}
      NEXT_PUBLIC_API_URL: ${{ inputs.release_checks && 'http://127.0.0.1:3200' || '' }}
      NEXT_PUBLIC_WS_URL: ${{ inputs.release_checks && 'ws://127.0.0.1:3201' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.1'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir client exec playwright install --with-deps chromium
      - name: Full browser suite
        if: '!inputs.release_checks'
        run: pnpm --dir client test:e2e --shard=${{ matrix.shard }}/8 --timeout=60000 --retries=0
      # Any failure blocks the deploy, so stop at the first one (after its
      # retry) instead of spending up to 6 minutes on each further test.
      - name: Release browser regression on desktop and mobile
        if: inputs.release_checks
        run: >-
          pnpm --dir client test:e2e --max-failures=1 --timeout=360000
          e2e/ad-review-safety.spec.ts
          e2e/campaign-history-accessibility.spec.ts
          e2e/crm-recovery.spec.ts
          e2e/home-ux001.spec.ts
