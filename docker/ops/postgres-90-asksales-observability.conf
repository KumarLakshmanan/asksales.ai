# AskSales production Postgres: slow-query log and query statistics.
# Install as /etc/postgresql/17/main/conf.d/90-asksales-observability.conf
# (see docker/ops/README.md). shared_preload_libraries needs a
# Postgres restart; the other settings take effect on reload.

# Per-statement totals (calls, time, rows, buffers) without logging each query.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
track_io_timing = on

# Log any statement slower than 2 s. Request reads time out at 25 s, so this
# catches pages getting slow well before users see errors.
log_min_duration_statement = 2000
# Bound values hold customer emails, phone numbers and message text; log the
# statement with $1, $2... but not the bound values. Values written straight
# into the SQL text are still logged.
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0

# Waits on row/table locks longer than deadlock_timeout (1 s).
log_lock_waits = on
# Sorts and hashes that spill more than 10 MB to disk.
log_temp_files = 10MB
# Autovacuum runs that take longer than 10 s.
log_autovacuum_min_duration = 10s
