# AskSales production: container logs are kept in the systemd journal so they
# survive deploys (each deploy replaces the containers, and json-file logs go
# with them). Install as /etc/systemd/journald.conf.d/90-asksales.conf and run
# `systemctl restart systemd-journald`.
[Journal]
Storage=persistent
SystemMaxUse=3G
SystemKeepFree=10G
MaxRetentionSec=30day
