# AskSales production: limits for container logs kept in the systemd journal
# (see docker/ops/README.md, step 2). Install as
# /etc/systemd/journald.conf.d/90-asksales.conf and run
# `systemctl restart systemd-journald`.
[Journal]
Storage=persistent
SystemMaxUse=3G
# Stop growing the journal when free disk falls below this.
SystemKeepFree=5G
MaxRetentionSec=30day
# Docker writes every container's logs as one journald service, so the
# default 10,000 lines per 30 s is shared by API and workers. They write
# about 150 lines a minute together; leave room for a busy campaign.
RateLimitIntervalSec=30s
RateLimitBurst=100000
