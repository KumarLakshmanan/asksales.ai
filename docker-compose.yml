# ───────────────────────────────────────────────────────────────────────────────
# Agentic Orchestration Platform V2 — Docker Compose
# Services: API Gateway, Worker, unified Client/Admin,
#           Redis, PostgreSQL, object storage, BullMQ Dashboard, Adminer
# ───────────────────────────────────────────────────────────────────────────────

services:
  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: ${DB_NAME:-salesmarketing}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── MinIO (S3-compatible Object Storage) ───────────────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── MinIO Bucket Init ────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/$${MINIO_BUCKET:-salesmarketing-uploads};
      mc anonymous set download local/$${MINIO_BUCKET:-salesmarketing-uploads};
      exit 0;
      "

  # ─── API Gateway (Express Server) ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    security_opt:
      - seccomp=./docker/chromium-seccomp.json
    ports:
      - '${PORT:-8080}:8080'
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
      PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: postgres
      DB_PORT: 5432
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_S3_BUCKET: ${MINIO_BUCKET:-salesmarketing-uploads}
      AWS_REGION: us-east-1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - uploads:/app/server/uploads
      - exports:/app/exports
    restart: unless-stopped

  # ─── Tool Workers (BullMQ) ────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: server/Dockerfile.worker
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: postgres
      DB_PORT: 5432
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_S3_BUCKET: ${MINIO_BUCKET:-salesmarketing-uploads}
      AWS_REGION: us-east-1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      replicas: 2
    volumes:
      - uploads:/app/server/uploads
    restart: unless-stopped

  # ─── Client (Next.js) ─────────────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ''
        BACKEND_URL: http://api:8080
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: ''
      BACKEND_URL: http://api:8080
    depends_on:
      - api
    restart: unless-stopped

  # ─── BullMQ Dashboard (Bull Board) ────────────────────────────────────────
  bull-board:
    image: deadly0/bull-board
    ports:
      - '127.0.0.1:3002:3000'
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Adminer (Database GUI) ───────────────────────────────────────────────
  adminer:
    image: adminer:latest
    ports:
      - '127.0.0.1:8081:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
  minio-data:
  uploads:
  exports:
