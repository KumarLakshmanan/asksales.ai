# Nginx configuration for the isolated AskSales staging environment.
#
# This file is deliberately separate from asksales.conf. It only proxies
# dev.asksales.ai to the staging containers on 127.0.0.1:3002/8081 and must
# never be installed over the production site.

limit_req_zone $binary_remote_addr zone=dev_asksales_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=dev_asksales_app_limit:10m rate=60r/s;

# Install this HTTP block first when issuing the certificate for the first
# time. Once the certificate exists, replace it with the HTTPS configuration
# below and reload Nginx.
server {
    listen 80;
    server_name dev.asksales.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dev.asksales.ai;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/dev.asksales.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.asksales.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AskSalesDevSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~* (^|/)\.(?!well-known(?:/|$)) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(?:env|ini|log|sql|bak|backup|old|orig|swp|key|pem)(?:\.[^/]*)?$ {
        access_log off;
        log_not_found off;
        return 404;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8081/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket progress updates from the staging API.
    location /api/agents/progress {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        limit_req zone=dev_asksales_api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location /uploads/ {
        limit_req zone=dev_asksales_api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=dev_asksales_app_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
