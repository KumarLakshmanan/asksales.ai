# ─── Nginx configuration for asksales.ai ────────────────────────────────────
# Domains on this server: asksales.ai | api.asksales.ai | admin.asksales.ai
# One Let's Encrypt SAN certificate covers all three hostnames.
# service.asksales.ai remains on the legacy server until its DNS is migrated.

# ─── Rate limiting zones ──────────────────────────────────────────────────────
# (shared with salesmarketing.conf — define only once in nginx.conf or here if standalone)
limit_req_zone $binary_remote_addr zone=asksales_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=asksales_app_limit:10m rate=60r/s;

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name asksales.ai api.asksales.ai admin.asksales.ai;
    return 301 https://$host$request_uri;
}

# ─── asksales.ai → client (port 3000) ────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name asksales.ai;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/asksales.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asksales.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AskSalesSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Reject common secret and backup probes before they reach Next.js or the
    # API. ACME's .well-known path remains available for certificate tooling.
    location ~* (^|/)\.(?!well-known(?:/|$)) {
        access_log off;
        log_not_found off;
        return 404;
    }
    location ~* \.(?:env|ini|log|sql|bak|backup|old|orig|swp|key|pem)(?:\.[^/]*)?$ {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Short-lived, HMAC-signed image delivery for Meta attachment crawlers.
    # This intentionally lives outside /api because robots.txt blocks /api/.
    location /support-media-delivery/ {
        limit_req zone=asksales_api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_connect_timeout 15s;
    }

    # WebSocket for /api/agents/progress (proxy to backend on 8080)
    location /api/agents/progress {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API requests → backend on 8080 (path-based proxy, no separate subdomain needed)
    location /api/ {
        limit_req zone=asksales_api_limit burst=60 nodelay;
        client_max_body_size 100M;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Uploads requests → backend on 8080 (serves uploaded files directly)
    location /uploads/ {
        limit_req zone=asksales_api_limit burst=60 nodelay;
        client_max_body_size 100M;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static agent avatars are served by Next.js from /app/public/
    # (previously aliased from disk; now proxied through the Next.js container)

    location / {
        limit_req zone=asksales_app_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# ─── api.asksales.ai → redirect to asksales.ai/api (kept for backward compat) ─
server {
    listen 443 ssl http2;
    server_name api.asksales.ai;

    ssl_certificate /etc/letsencrypt/live/asksales.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asksales.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AskSalesSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Permanent redirect: api.asksales.ai/<path> -> asksales.ai/<path>
    return 301 https://asksales.ai$request_uri;
}

# ─── admin.asksales.ai → admin routes in the unified client (port 3000) ─────
server {
    listen 443 ssl http2;
    server_name admin.asksales.ai;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/asksales.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asksales.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AskSalesSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~* (^|/)\.(?!well-known(?:/|$)) {
        access_log off;
        log_not_found off;
        return 404;
    }
    location ~* \.(?:env|ini|log|sql|bak|backup|old|orig|swp|key|pem)(?:\.[^/]*)?$ {
        access_log off;
        log_not_found off;
        return 404;
    }

    location / {
        limit_req zone=asksales_app_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
